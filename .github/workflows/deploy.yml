name: Deploy Zerodha App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/dist

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard-dist

      - name: Deploy to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dashboard-dist/*"
          target: "/tmp/zerodha-dashboard"
          strip_components: 1

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/ZERODHA-PROJECT

            git pull origin main

            cd backend
            npm ci --omit=dev

            pm2 restart zerodha-backend
            pm2 save

            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /tmp/zerodha-dashboard/* /usr/share/nginx/html/

            sudo nginx -t
            sudo systemctl reload nginx

            rm -rf /tmp/zerodha-dashboard